<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BW Green Roof Predictions</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css"
  >

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .panel {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;

      width: 290px;

      background: rgba(255,255,255,0.96);
      border-radius: 10px;
      padding: 14px;

      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .panel h2 {
      margin: 0 0 4px;
      font-size: 18px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 14px;
    }

    .control {
      margin-bottom: 14px;
    }

    .control label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      padding: 7px;
    }

    .radio-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    .legend {
      margin-top: 12px;
      font-size: 12px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      margin: 4px 0;
    }

    .swatch {
      width: 18px;
      height: 14px;
      margin-right: 7px;
      border: 1px solid #777;
    }

    .gradient {
      height: 14px;
      width: 100%;
      border: 1px solid #777;
      background:
        linear-gradient(
          to right,
          #d9d9d9,
          #ffffb2,
          #78c679,
          #238443,
          #004529
        );
      margin-top: 6px;
    }

    .gradient-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #555;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div class="panel">

  <h2>Green Roof Predictions</h2>
  <div class="subtitle">Stuttgart</div>

  <div class="control">
    <label for="classification">
      Classification threshold
    </label>

    <select id="classification">
      <option value="pred_f1">
        F1-optimized threshold
      </option>

      <option value="pred_ge_085">
        Probability ≥ 0.85
      </option>

      <option value="pred_ge_090">
        Probability ≥ 0.90
      </option>

      <option value="pred_top1pct">
        Top 1%
      </option>

      <option value="pred_top2pct">
        Top 2%
      </option>

      <option value="pred_top5pct">
        Top 5%
      </option>
    </select>
  </div>


  <div class="control">

    <label>
      Display
    </label>

    <div class="radio-row">

      <label>
        <input
          type="radio"
          name="display"
          value="all"
          checked
        >
        All
      </label>

      <label>
        <input
          type="radio"
          name="display"
          value="green"
        >
        Green
      </label>

      <label>
        <input
          type="radio"
          name="display"
          value="nongreen"
        >
        Non-green
      </label>

    </div>

  </div>


  <div class="control">

    <label>
      Visualization
    </label>

    <div class="radio-row">

      <label>
        <input
          type="radio"
          name="visualization"
          value="classification"
          checked
        >
        Class
      </label>

      <label>
        <input
          type="radio"
          name="visualization"
          value="probability"
        >
        Probability
      </label>

    </div>

  </div>


  <div id="classLegend" class="legend">

    <div class="legend-row">
      <span
        class="swatch"
        style="background:#1a9850"
      ></span>
      Predicted green roof
    </div>

    <div class="legend-row">
      <span
        class="swatch"
        style="background:#cccccc"
      ></span>
      Predicted non-green
    </div>

  </div>


  <div
    id="probabilityLegend"
    class="legend"
    style="display:none"
  >

    Green-roof probability

    <div class="gradient"></div>

    <div class="gradient-labels">
      <span>0</span>
      <span>0.5</span>
      <span>1.0</span>
    </div>

  </div>

</div>


<script
  src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js">
</script>


<script type="module">

import * as maplibregl
  from "https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs";


const protocol =
  new window.pmtiles.Protocol();

maplibregl.addProtocol(
  "pmtiles",
  protocol.tile
);


const PMTILES_URL =
  "http://localhost:8000/tiles/stuttgart_full.pmtiles";


const archive =
  new window.pmtiles.PMTiles(
    PMTILES_URL
  );

protocol.add(archive);


const map =
  new maplibregl.Map({

    container:
      "map",

    style:
      "https://tiles.openfreemap.org/styles/bright",

    center: [
      9.1829,
      48.7758
    ],

    zoom:
      13

  });


map.addControl(
  new maplibregl.NavigationControl(),
  "top-right"
);


map.addControl(
  new maplibregl.ScaleControl({
    maxWidth: 150,
    unit: "metric"
  })
);


const classificationSelect =
  document.getElementById(
    "classification"
  );


const classLegend =
  document.getElementById(
    "classLegend"
  );


const probabilityLegend =
  document.getElementById(
    "probabilityLegend"
  );


function currentClassification() {

  return classificationSelect.value;

}


function currentDisplayMode() {

  return document.querySelector(
    'input[name="display"]:checked'
  ).value;

}


function currentVisualization() {

  return document.querySelector(
    'input[name="visualization"]:checked'
  ).value;

}


function updateRoofStyle() {

  if (!map.getLayer("roof-fill")) {
    return;
  }

  const field =
    currentClassification();

  const displayMode =
    currentDisplayMode();

  const visualization =
    currentVisualization();


  // ------------------------
  // FILTER
  // ------------------------

  if (displayMode === "green") {

    map.setFilter(
      "roof-fill",
      [
        "==",
        ["get", field],
        1
      ]
    );

    map.setFilter(
      "roof-outline",
      [
        "==",
        ["get", field],
        1
      ]
    );

  }

  else if (
    displayMode === "nongreen"
  ) {

    map.setFilter(
      "roof-fill",
      [
        "==",
        ["get", field],
        0
      ]
    );

    map.setFilter(
      "roof-outline",
      [
        "==",
        ["get", field],
        0
      ]
    );

  }

  else {

    map.setFilter(
      "roof-fill",
      null
    );

    map.setFilter(
      "roof-outline",
      null
    );

  }


  // ------------------------
  // COLOR
  // ------------------------

  if (
    visualization ===
    "probability"
  ) {

    map.setPaintProperty(
      "roof-fill",
      "fill-color",
      [
        "interpolate",
        ["linear"],

        [
          "to-number",
          [
            "get",
            "proba_greenroof"
          ]
        ],

        0.0,
        "#d9d9d9",

        0.50,
        "#ffffb2",

        0.70,
        "#78c679",

        0.85,
        "#31a354",

        0.90,
        "#238443",

        1.0,
        "#004529"
      ]
    );


    classLegend.style.display =
      "none";

    probabilityLegend.style.display =
      "block";

  }

  else {

    map.setPaintProperty(
      "roof-fill",
      "fill-color",
      [
        "case",

        [
          "==",
          ["get", field],
          1
        ],

        "#1a9850",

        "#cccccc"
      ]
    );


    classLegend.style.display =
      "block";

    probabilityLegend.style.display =
      "none";

  }

}


map.on(
  "load",
  () => {

    map.addSource(
      "roofs",
      {

        type:
          "vector",

        url:
          `pmtiles://${PMTILES_URL}`

      }
    );


    map.addLayer({

      id:
        "roof-fill",

      type:
        "fill",

      source:
        "roofs",

      "source-layer":
        "green_roofs",

      minzoom:
        11,

      paint: {

        "fill-color": [
          "case",

          [
            "==",
            ["get", "pred_f1"],
            1
          ],

          "#1a9850",

          "#cccccc"
        ],

        "fill-opacity":
          0.72

      }

    });


    map.addLayer({

      id:
        "roof-outline",

      type:
        "line",

      source:
        "roofs",

      "source-layer":
        "green_roofs",

      minzoom:
        14,

      paint: {

        "line-color":
          "#222222",

        "line-width":
          0.45,

        "line-opacity":
          0.7

      }

    });


    updateRoofStyle();


    map.on(
      "click",
      "roof-fill",
      (event) => {

        const feature =
          event.features?.[0];

        if (!feature) {
          return;
        }

        const p =
          feature.properties;


        const probability =
          Number(
            p.proba_greenroof
          );


        const popupHTML = `
          <strong>
            Roof prediction
          </strong>

          <br><br>

          <b>
            Green-roof probability:
          </b>

          ${
            (
              probability * 100
            ).toFixed(1)
          }%

          <br>

          <b>F1:</b>
          ${
            Number(p.pred_f1) === 1
              ? "Green"
              : "Non-green"
          }

          <br>

          <b>≥ 0.85:</b>
          ${
            Number(
              p.pred_ge_085
            ) === 1
              ? "Green"
              : "Non-green"
          }

          <br>

          <b>≥ 0.90:</b>
          ${
            Number(
              p.pred_ge_090
            ) === 1
              ? "Green"
              : "Non-green"
          }

          <br>

          <b>Top 1%:</b>
          ${
            Number(
              p.pred_top1pct
            ) === 1
              ? "Yes"
              : "No"
          }

          <br>

          <b>Top 2%:</b>
          ${
            Number(
              p.pred_top2pct
            ) === 1
              ? "Yes"
              : "No"
          }

          <br>

          <b>Top 5%:</b>
          ${
            Number(
              p.pred_top5pct
            ) === 1
              ? "Yes"
              : "No"
          }

          <hr>

          <b>Roof ID:</b>
          ${p.roof_id ?? "—"}

          <br>

          <b>Building:</b>
          ${p.building_id ?? "—"}

          <br>

          <b>Area:</b>
          ${
            p.area_m2
              ? Number(
                  p.area_m2
                ).toFixed(1)
                + " m²"
              : "—"
          }

          <br>

          <b>Slope:</b>
          ${
            p.slope_deg
              ? Number(
                  p.slope_deg
                ).toFixed(1)
                + "°"
              : "—"
          }

          <br>

          <b>Height:</b>
          ${
            p.height_m
              ? Number(
                  p.height_m
                ).toFixed(1)
                + " m"
              : "—"
          }

          <br>

          <b>Roof type:</b>
          ${p.roofType ?? "—"}

          <br>

          <b>Function:</b>
          ${p.function ?? "—"}
        `;


        new maplibregl.Popup()
          .setLngLat(
            event.lngLat
          )
          .setHTML(
            popupHTML
          )
          .addTo(
            map
          );

      }
    );


    map.on(
      "mouseenter",
      "roof-fill",
      () => {

        map.getCanvas()
          .style.cursor =
          "pointer";

      }
    );


    map.on(
      "mouseleave",
      "roof-fill",
      () => {

        map.getCanvas()
          .style.cursor =
          "";

      }
    );

  }
);


classificationSelect
  .addEventListener(
    "change",
    updateRoofStyle
  );


document
  .querySelectorAll(
    'input[name="display"]'
  )
  .forEach(
    element => {

      element
        .addEventListener(
          "change",
          updateRoofStyle
        );

    }
  );


document
  .querySelectorAll(
    'input[name="visualization"]'
  )
  .forEach(
    element => {

      element
        .addEventListener(
          "change",
          updateRoofStyle
        );

    }
  );

</script>

</body>
</html>
